<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Submitted – IEEE SRHU</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { background-color: var(--bg-body); }
    .result-page {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .result-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 4rem 2rem;
      width: 100%;
      max-width: 600px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .result-card h2 { color: #0f172a; margin: 1rem 0 0.5rem; }
    .result-card p { color: #475569; margin-bottom: 2rem; font-size: 1.1rem; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand">
      <img src="/images/logo.png" class="logo-icon" alt="IEEE SRHU Logo" />
      <div><span>IEEE SRHU Student Branch</span><small>Aptitude Quiz</small></div>
    </a>
    <div class="navbar-links">
      <button onclick="logout()" class="btn btn-outline btn-sm">Logout</button>
    </div>
  </div>
</nav>

<div class="result-page">
  <div class="container" style="display:flex; justify-content:center;">
    <div class="result-card">
      <div style="font-size: 4rem; line-height:1;">✅</div>
      <h2>Quiz Submitted Successfully!</h2>
      <p>Your responses have been recorded securely. The final results will be announced by the administration.</p>
      <a href="/" class="btn btn-primary" style="width: 100%; max-width: 250px;">Return to Home</a>
    </div>
  </div>
</div>

<script>
  function logout() {
    localStorage.clear();
    window.location.href = '/login.html';
  }
</script>

</body>
</html>
