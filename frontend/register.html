<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – IEEE SRHU Student Branch Aptitude Quiz</title>
  <meta name="description" content="Register for the IEEE SRHU Student Branch Aptitude Quiz. Create your account to participate in the membership drive assessment." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>

<!-- ─── Navbar ─────────────────────────────────────────────── -->
<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand">
      <img src="/images/logo.png" class="logo-icon" alt="IEEE SRHU Logo" />
      <div><span>IEEE SRHU Student Branch</span><small>Aptitude Quiz</small></div>
    </a>
    <div class="navbar-links">
      <span style="font-size:0.875rem; color: var(--text-secondary);">Already have an account?</span>
      <a href="/login.html" class="btn btn-outline btn-sm">Sign In</a>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <img src="/images/logo.png" class="auth-logo" alt="IEEE SRHU Logo" />
      <h1>Create Account</h1>
      <p>Fill in your details to register for the aptitude quiz</p>
    </div>

    <!-- Error / Success -->
    <div id="msg-box" style="display:none;"></div>

    <!-- Form -->
    <form id="register-form" autocomplete="off">
      <div class="form-grid">
        <!-- Full Name -->
        <div class="form-group full">
          <label for="reg-name">Full Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Enter your full name" required />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="reg-email">College Email *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="you@srhu.edu.in" required />
        </div>

        <!-- Enrollment -->


        <!-- Phone -->
        <div class="form-group">
          <label for="reg-phone">Phone Number *</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="10-digit mobile number" required maxlength="10" pattern="[6-9][0-9]{9}" />
        </div>

        <!-- Course -->
        <div class="form-group">
          <label for="reg-course">Course *</label>
          <select id="reg-course" class="form-control" required>
            <option value="">Select course</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>B.Tech</option>
            <option>M.Tech</option>
            <option>BBA</option>
            <option>MBA</option>
            <option>BSc</option>
            <option>MSc</option>
            <option>Other</option>
          </select>
        </div>

        <!-- Semester -->
        <div class="form-group">
          <label for="reg-sem">Semester *</label>
          <select id="reg-sem" class="form-control" required>
            <option value="">Select semester</option>
            <option value="1">1st</option>
            <option value="2">2nd</option>
            <option value="3">3rd</option>
            <option value="4">4th</option>
            <option value="5">5th</option>
            <option value="6">6th</option>
            <option value="7">7th</option>
            <option value="8">8th</option>
          </select>
        </div>

        <!-- Department (optional) -->
        <div class="form-group">
          <label for="reg-dept">Department <span style="color:var(--text-muted)">(optional)</span></label>
          <input type="text" id="reg-dept" class="form-control" placeholder="e.g. Computer Science" />
        </div>

        <!-- Gender (optional) -->
        <div class="form-group">
          <label for="reg-gender">Gender <span style="color:var(--text-muted)">(optional)</span></label>
          <select id="reg-gender" class="form-control">
            <option value="">Prefer not to say</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>

        <!-- IEEE Status -->
        <div class="form-group full">
          <label for="reg-ieee">IEEE Membership Status</label>
          <select id="reg-ieee" class="form-control">
            <option value="Non-Member">Non-Member</option>
            <option value="Member">Existing Member</option>
          </select>
        </div>

        <!-- Password -->
        <div class="form-group full">
          <label for="reg-password">Password *</label>
          <div class="input-wrap">
            <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" />
            <button type="button" class="toggle-pw" onclick="togglePw('reg-password', this)">👁️</button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group full">
          <label for="reg-confirm">Confirm Password *</label>
          <div class="input-wrap">
            <input type="password" id="reg-confirm" class="form-control" placeholder="Re-enter password" required />
            <button type="button" class="toggle-pw" onclick="togglePw('reg-confirm', this)">👁️</button>
          </div>
        </div>
      </div>

      <button type="submit" id="reg-btn" class="btn btn-primary btn-auth">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already registered? <a href="/login.html">Sign in here</a>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // Redirect if already logged in
  if (localStorage.getItem('token')) window.location.href = '/instructions.html';

  function togglePw(id, btn) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
  }

  function showMsg(type, text) {
    const box = document.getElementById('msg-box');
    box.className = `alert alert-${type}`;
    box.textContent = text;
    box.style.display = 'flex';
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('reg-btn');

    const password = document.getElementById('reg-password').value;
    const confirm  = document.getElementById('reg-confirm').value;

    if (password !== confirm) {
      showMsg('error', '❌ Passwords do not match.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Registering...';

    const payload = {
      name:         document.getElementById('reg-name').value.trim(),
      email:        document.getElementById('reg-email').value.trim(),

      phone:        document.getElementById('reg-phone').value.trim(),
      course:       document.getElementById('reg-course').value,
      semester:     document.getElementById('reg-sem').value,
      department:   document.getElementById('reg-dept').value.trim(),
      gender:       document.getElementById('reg-gender').value,
      ieeeStatus:   document.getElementById('reg-ieee').value,
      password
    };

    try {
      const res  = await fetch('https://ieee-quiz-c3u1.onrender.com/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showMsg('success', '✅ Registration successful! Redirecting...');
        setTimeout(() => window.location.href = '/instructions.html', 1200);
      } else {
        showMsg('error', '❌ ' + data.message);
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    } catch {
      showMsg('error', '❌ Unable to connect to server. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });
</script>

</body>
</html>
